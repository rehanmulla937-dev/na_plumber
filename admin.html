<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NA Plumber • Owner Admin</title><link rel="stylesheet" href="style.css"><style>.admin-page{min-height:100vh;background:#07111f;color:#eef6ff;padding:30px 16px}.admin-wrap{max-width:1100px;margin:auto}.admin-login,.admin-panel{background:#0d1b2d;border:1px solid #1d3854;border-radius:20px;padding:28px;box-shadow:0 20px 50px #0006}.admin-login{max-width:430px;margin:7vh auto}.admin-login input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 15px;border-radius:10px;border:1px solid #2b4965;background:#081321;color:#fff}.admin-login label{display:block}.admin-btn{width:100%;padding:13px;border:0;border-radius:10px;background:#1683ff;color:#fff;font-weight:700;cursor:pointer}.error{color:#ff8b8b;min-height:22px}.admin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logout{width:auto;background:#20344a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:#10243a;border:1px solid #1e3d59;border-radius:15px;padding:20px}.stat b{font-size:30px;display:block}.stat small{color:#9db0c5}.table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse;min-width:850px}.admin-table th,.admin-table td{text-align:left;padding:12px;border-bottom:1px solid #20384e}.admin-table th{color:#8fc6ff}.admin-table select{padding:7px;border-radius:8px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}} </style></head><body class="admin-page"><div class="admin-wrap"><section id="loginBox" class="admin-login"><div style="font-size:34px">🔐</div><p>NA PLUMBER SERVICE</p><h1>Owner Admin Login</h1><p>Private dashboard. Owner access only.</p><form id="loginForm"><label>Owner ID<input id="ownerId" value="naplumberservicehyderabad@gmail.com" readonly></label><label>Owner Password<input id="ownerPassword" type="password" autocomplete="current-password" required placeholder="Enter owner password"></label><button class="admin-btn">Login</button><div id="error" class="error"></div></form><small>Password is kept out of the public website source.</small></section><section id="dashboard" class="admin-panel" hidden><div class="admin-top"><div><p>NA PLUMBER SERVICE</p><h1>Owner Dashboard</h1></div><button class="admin-btn logout" id="logout">Logout</button></div><div class="stats"><div class="stat"><b id="total">0</b><small>Total bookings</small></div><div class="stat"><b id="customers">0</b><small>Customers</small></div><div class="stat"><b id="completed">0</b><small>Completed</small></div><div class="stat"><b id="pending">0</b><small>Pending</small></div></div><div class="table-wrap"><table class="admin-table"><thead><tr><th>Date</th><th>Customer</th><th>Mobile</th><th>Service</th><th>Address</th><th>Problem</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="7">No bookings yet.</td></tr></tbody></table></div></section></div><script>/* Temporary owner-only gate. For production, replace with Firebase Authentication; never publish a real password in a public repo. */const OWNER_ID='naplumberservicehyderabad@gmail.com';const OWNER_PASSWORD='9059991545';const $=id=>document.getElementById(id);$('loginForm').addEventListener('submit',e=>{e.preventDefault();if($('ownerId').value===OWNER_ID&&$('ownerPassword').value===OWNER_PASSWORD){$('loginBox').hidden=true;$('dashboard').hidden=false;render()}else $('error').textContent='Incorrect owner password.'});$('logout').onclick=()=>location.reload();function render(){const b=JSON.parse(localStorage.getItem('naPlumberBookings')||'[]');$('total').textContent=b.length;$('customers').textContent=new Set(b.map(x=>x.mobile)).size;$('completed').textContent=b.filter(x=>x.status==='Completed').length;$('pending').textContent=b.filter(x=>x.status!=='Completed').length;$('rows').innerHTML=b.length?b.map((x,i)=>`<tr><td>${safe(x.date)}</td><td>${safe(x.name)}</td><td>${safe(x.mobile)}</td><td>${safe(x.service)}</td><td>${safe(x.address)}</td><td>${safe(x.problem)}</td><td><select onchange="status(${i},this.value)"><option ${x.status!=='Completed'?'selected':''}>Pending</option><option ${x.status==='Completed'?'selected':''}>Completed</option></select></td></tr>`).join(''):'<tr><td colspan="7">No bookings yet.</td></tr>'}function status(i,v){const b=JSON.parse(localStorage.getItem('naPlumberBookings')||'[]');b[i].status=v;localStorage.setItem('naPlumberBookings',JSON.stringify(b));render()}function safe(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
